# Publishes the docs site to GitHub Pages.
#
# No push trigger any more. Every commit that lands on main is deployed by
# release.yml, at the end of its pipeline and from the tag it just cut, so the
# site matches the version on the registry rather than whatever main had at the
# time. Keeping a push trigger here as well would deploy the same commit twice,
# once from each workflow, and the second one to finish would win.
#
# What is left is the two ways in that release.yml does not cover: a pull
# request, and by hand.
name: Deploy to GitHub Pages
on:
    pull_request:
        branches: ['main']
    workflow_call:
        inputs:
            ref:
                description: 'Commit, tag or branch to build the site from'
                required: false
                type: string
    workflow_dispatch:
        inputs:
            ref:
                description: 'Commit, tag or branch to build the site from'
                required: false
                type: string

permissions:
    contents: read
    pages: write
    id-token: write
jobs:
    deploy:
        name: Deploy
        concurrency:
            group: 'deploy-to-github-pages'
            cancel-in-progress: true
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # The tag when release.yml calls this, the event's own ref
                  # otherwise.
                  ref: ${{ inputs.ref || github.ref }}
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - name: Unit tests
              run: npm ci && npm run test:unit
            - name: Build project
              run: npm run build
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: './dist'
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
